# chrony NTP configuration for the STUN appliance.
# Accurate time keeps log timestamps trustworthy for correlation.

# Public NTP pool servers.
pool pool.ntp.org iburst

# Allow the system clock to be stepped in the first three updates.
makestep 1.0 3

# Drift file (writable by the chrony user).
driftfile /var/lib/chrony/chrony.drift

# Log directory.
logdir /var/log/chrony
